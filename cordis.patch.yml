# dsh-editor-context bundle patch.
#
# Two independent channels, two switches.
#
# ── 1. The chip channel (default on) ────────────────────────────────────────
#
# `http: true` mounts a read-only GET /editor-context/position, and the package's
# browser half turns it into an `@` menu entry. Picking one inserts
# `@<absolute path>#L146-L154` into the composer. Nothing enters the
# conversation that the user did not type, so there is no ordinal to keep and
# nothing to tell apart from a real message.
#
#   http: false        # turn the chip channel off entirely
#   httpPath: /…       # move the endpoint
#
# ── 2. The push channel (default off) ──────────────────────────────────────
#
# The first implementation pushed a numbered marker (`[编辑器位置 #3 …]`) into
# the conversation. It still works and is still the only option when the user
# cannot type — `selection` mode watches the editor instead — but it is opt-in,
# because a pushed marker is a message the user did not write.
#
#   off          (default) nothing is ever pushed; no slash command exists
#   on-demand              `commands` below are registered, e.g. /ide
#   selection              the above, plus one automatic marker per *changed
#                          non-empty selection*. A bare cursor never triggers it.
#
# Markers are rendered as context rows rather than as the user's words, because
# their `source.form` is `snapshot`; the numbering is durable, so it survives a
# restart and a resumed conversation.
- insert:
    - id: editor-context
      name: 'dsh-editor-context'
      config:
        mode: off
        # stateDir: "~/.editor-context"   # where the editor extension publishes
        # maxAgeSeconds: 3600             # ignore a position older than this
        # commands: [ide, here]           # slash-command names for mode: on-demand
        # http: false                     # disable the composer chip channel
        # httpPath: /editor-context/position
