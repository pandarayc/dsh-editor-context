# dsh-editor-context bundle patch.
#
# Two hops, neither of them an interval.
#
#   editor extension  --WebSocket-->  this plugin  --long poll-->  the browser
#
# The plugin dials the extension's publisher (`editorContext.ws.*` on that side),
# and the browser half parks a request on GET /editor-context/next until a
# delivery arrives. `http: true` also mounts GET /editor-context/position, which
# backs the `@` menu: picking an entry inserts `@<absolute path>#L146-L154` into
# the composer, and nothing enters the conversation that the user did not type.
#
#   wsUrl: ws://127.0.0.1:7788/editor-context   # match editorContext.ws.*
#   wsToken: …                                  # same string as editorContext.ws.token
#   http: false                                 # turn the browser routes off
#
# Up to 0.3.0 there was a second, opt-in "push channel" (`mode: on-demand` or
# `selection`) that injected a numbered marker into the conversation. It is gone:
# a marker is a message the user did not write, it needs an ordinal so that three
# of them can be told apart, and the chip made all of that unnecessary. See
# CHANGELOG 0.4.0.
- insert:
    - id: editor-context
      name: 'dsh-editor-context'
      config:
        # wsUrl: "ws://127.0.0.1:7788/editor-context"  # the editor's publisher
        # wsToken: ""                    # required if that side set a token
        # wsName: dsh                    # subscriber identity, and its send target
        # wsLabel: DSH                   # how the editor's picker names it
        # includeText: true              # ask for the selected text too
        # autoSelection: false           # also receive every changed selection
        # stateDir: "~/.editor-context"  # where window state is published
        # maxAgeSeconds: 3600            # ignore a position older than this
        # http: false                    # disable the browser routes
        # httpPath: /editor-context/position
